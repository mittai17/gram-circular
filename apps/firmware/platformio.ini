; PlatformIO Project Configuration File for GRAM-CIRCULAR ESP32 Firmware
; Smart India Hackathon (SIH 2026)
; Microcontroller: ESP32 NodeMCU DevKit V1 (38-pin / 30-pin)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MONITOR_SPEED=115200

lib_deps =
    bogde/HX711 @ ^0.7.5
    bblanchon/ArduinoJson @ ^7.0.4

; Partitions & Memory
board_build.partitions = default.csv
board_build.filesystem = spiffs
